name: Publish to npm

on:
  # Prefer publishing from a GitHub Release (keeps npm version intentional)
  release:
    types: [published]
  # Manual fallback from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional git tag to checkout before publish (e.g. v1.1.0). Leave empty to use the current ref.'
        required: false
        type: string

# id-token: write is required for npm Trusted Publishing (OIDC)
permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs a recent npm CLI (>= 11.5.1)
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never cache package manager state in release builds
          cache: yarn

      - name: Upgrade npm for Trusted Publishing / OIDC
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test --ci --coverage=false

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi
          echo "Publishing react-native-wallet-pay@$PKG_VERSION"

      # No NPM_TOKEN — auth comes from GitHub OIDC via npm Trusted Publishing
      - name: Publish to npm
        run: npm publish --access public --provenance
